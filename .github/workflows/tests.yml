# Автотесты при каждом пуше и pull request:
# модульные (node --test) и сквозные в Chromium (Playwright + axe-core)
name: Тесты

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Модульные тесты
        run: npm run test:unit
      - name: Сквозные тесты (компьютер, телефон, планшет)
        run: npm run test:e2e
      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
